<!DOCTYPE html>
<html lang="ja">
<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Material Design 3 に沿った配色・形・余白。レイアウト：上部バー＋タブ、本文はカードを縦に積む */
:root{
  --primary:#6a5d3f;--on-primary:#fff;--primary-c:#f3e1bb;--on-primary-c:#231a04;
  --secondary-c:#ece1cb;--on-secondary-c:#211b0d;--tertiary-c:#dbe4d3;--on-tertiary-c:#141e10;
  --surface:#fdf9f3;--sc-low:#f8f3ea;--sc:#f2ede4;--sc-high:#ece7de;--sc-highest:#e6e2d9;
  --on-surface:#1d1b16;--on-surface-v:#4b4739;--outline:#7d7767;--outline-v:#cec6b4;
  --error:#ba1a1a;--error-c:#ffdad6;--on-error-c:#410002;--warn-c:#ffe9b8;--on-warn-c:#3a2a00;--ok-c:#dbe4d3;--on-ok-c:#141e10;
  --sun:#c00000;--sat:#1f4fbf;
  --c-shift:#fff;--c-rest:#dbe4d3;--c-kb-t:#c00000;--c-KAN:#8f8ca0;--c-KAN-t:#fff;--row-pri:#f4dcdc;--row-sat:#f3e6d3;--row-busy:#b3261e;
  --font:"Roboto","Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#d7c5a0;--on-primary:#3a2f15;--primary-c:#51462a;--on-primary-c:#f3e1bb;
  --secondary-c:#4d4634;--on-secondary-c:#ece1cb;--tertiary-c:#3c4a36;--on-tertiary-c:#dbe4d3;
  --surface:#15130e;--sc-low:#1d1b16;--sc:#211f1a;--sc-high:#2c2a24;--sc-highest:#37342e;
  --on-surface:#e8e2d8;--on-surface-v:#cec6b4;--outline:#979080;--outline-v:#4b4739;
  --error:#ffb4ab;--error-c:#93000a;--on-error-c:#ffdad6;--warn-c:#574400;--on-warn-c:#ffe9b8;--ok-c:#3c4a36;--on-ok-c:#dbe4d3;
  --sun:#ff8a80;--sat:#a8c8ff;
  --c-shift:#1d1b16;--c-rest:#3c4a36;--c-kb-t:#ff8a80;--c-KAN:#56546a;--c-KAN-t:#fff;--row-pri:#3d2525;--row-sat:#3a301f;--row-busy:#ff8a80;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --primary:#d7c5a0;--on-primary:#3a2f15;--primary-c:#51462a;--on-primary-c:#f3e1bb;
  --secondary-c:#4d4634;--on-secondary-c:#ece1cb;--tertiary-c:#3c4a36;--on-tertiary-c:#dbe4d3;
  --surface:#15130e;--sc-low:#1d1b16;--sc:#211f1a;--sc-high:#2c2a24;--sc-highest:#37342e;
  --on-surface:#e8e2d8;--on-surface-v:#cec6b4;--outline:#979080;--outline-v:#4b4739;
  --error:#ffb4ab;--error-c:#93000a;--on-error-c:#ffdad6;--warn-c:#574400;--on-warn-c:#ffe9b8;--ok-c:#3c4a36;--on-ok-c:#dbe4d3;
  --sun:#ff8a80;--sat:#a8c8ff;
  --c-shift:#1d1b16;--c-rest:#3c4a36;--c-kb-t:#ff8a80;--c-KAN:#56546a;--c-KAN-t:#fff;--row-pri:#3d2525;--row-sat:#3a301f;--row-busy:#ff8a80;
  color-scheme:dark;}
*{box-sizing:border-box}

body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}

h2{font-size:16px;font-weight:500;margin:0 0 4px;letter-spacing:.1px}
p{margin:0}
.muted{color:var(--on-surface-v);font-size:12px}
.bar{position:sticky;top:0;z-index:30;background:var(--sc);}

.bar-in .sp{flex:1}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}

.legend span{border:1px solid var(--outline-v)}
td.num.low{background:var(--error-c);color:var(--on-error-c);font-weight:700}

tr.sum td{background:var(--sc-low);font-size:12px}
tr.sum td.ng{color:var(--error);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{padding:2px 8px;border-radius:6px;font-size:12px}
.note{border-radius:12px;padding:12px 16px;font-size:13px}
.note b{display:block;margin-bottom:4px;font-size:14px;font-weight:500}
.note ul{margin:0;padding-left:1.2em}
.note.err{background:var(--error-c);color:var(--on-error-c)}
.note.warn{background:var(--warn-c);color:var(--on-warn-c)}
.note.ok{background:var(--ok-c);color:var(--on-ok-c)}
.rules{display:flex;flex-wrap:wrap;gap:8px}
.rule{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:500;background:var(--ok-c);color:var(--on-ok-c)}
.rule.ng{background:var(--error-c);color:var(--on-error-c)}
.rule.na{background:var(--sc-high);color:var(--on-surface-v)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sc-high);border-radius:28px 28px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.25);padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet-in{max-width:1048px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet .ttl{display:flex;align-items:center;gap:8px;font-weight:500}
.sheet .codes{display:flex;flex-wrap:wrap;gap:8px}
.code{background:var(--surface);height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--outline-v);cursor:pointer;font-size:13px;font-weight:500;color:var(--on-surface)}
.code.cur{outline:2px solid var(--primary);outline-offset:1px}
.code.clr{background:var(--surface)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:var(--sc-high);border-radius:28px;padding:24px;max-width:520px;width:100%;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dlg h2{font-size:24px;font-weight:400;line-height:32px;margin:0}
.dlg .acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.dlg img{max-width:100%;border:1px solid var(--outline-v);border-radius:8px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--outline-v);border-radius:12px;padding:12px 16px;background:var(--surface);cursor:pointer;font-size:14px}
.opt b{font-weight:500;color:var(--primary)}
.opt:hover{background:var(--sc-low)}
.busy{display:inline-flex;align-items:center;gap:8px;color:var(--on-surface-v)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--outline-v);border-top-color:var(--primary);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.sw input,.sw input::after{transition:none}}
@media (max-width:600px){main{padding:12px 12px 140px}.card{padding:12px}.btn{padding:0 16px}h1{font-size:18px}}

<body>
<div id="app"></div>
<script>
/* ===== シフト作成ロジック（画面に依存しない部分） ===== */
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const SHORT = { E: '早', M: '中', L: '遅', F: '通', K: '休', KB: '希', Y: '有', HA: 'AM休', HP: 'PM休', S: '出張', T: '研修', O: '他店', W: '必', KAN: '館' };
const LONG = {
  E: '早番', M: '中番', L: '遅番', F: '通し', K: '公休', KB: '希望休', Y: '有休（終日）',
  HA: '午前休（遅番で勤務）', HP: '午後休（早番で勤務）', S: '出張', T: '研修', O: '他店ヘルプ', W: '必須出勤', KAN: '休館日'
};
const isRest = c => c === 'K' || c === 'KB' || c === 'Y' || c === 'KAN';
const isWork = c => !isRest(c);                       // 連勤に数える日（出張・研修・他店ヘルプ・半休を含む）
const onFloor = c => c === null || c === 'W' || c === 'E' || c === 'M' || c === 'L' || c === 'HA' || c === 'HP' || c === 'F';
const isShift = c => c === 'E' || c === 'M' || c === 'L';

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* 日本の祝日（振替休日・国民の休日を含む） */
function jpHolidays(y) {
  const set = {};
  const add = (m, d) => { set[m + '-' + d] = true; };
  const nthMon = (m, n) => ((8 - new Date(y, m - 1, 1).getDay()) % 7) + 1 + (n - 1) * 7;
  add(1, 1); add(2, 11); add(2, 23); add(4, 29); add(5, 3); add(5, 4); add(5, 5); add(8, 11); add(11, 3); add(11, 23);
  add(1, nthMon(1, 2)); add(7, nthMon(7, 3)); add(9, nthMon(9, 3)); add(10, nthMon(10, 2));
  const q = Math.floor((y - 1980) / 4);
  add(3, Math.floor(20.8431 + 0.242194 * (y - 1980) - q));
  add(9, Math.floor(23.2488 + 0.242194 * (y - 1980) - q));
  const has = dt => !!set[(dt.getMonth() + 1) + '-' + dt.getDate()];
  // 国民の休日（祝日に挟まれた平日）
  for (let m = 1; m <= 12; m++) {
    const n = new Date(y, m, 0).getDate();
    for (let d = 1; d <= n; d++) {
      const cur = new Date(y, m - 1, d);
      if (has(cur) || cur.getDay() === 0) continue;
      if (has(new Date(y, m - 1, d - 1)) && has(new Date(y, m - 1, d + 1))) set[m + '-' + d] = 'k';
    }
  }
  // 振替休日
  const base = Object.keys(set).filter(k => set[k] === true);
  for (const k of base) {
    const [m, d] = k.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    if (dt.getDay() !== 0) continue;
    const nx = new Date(y, m - 1, d + 1);
    while (has(nx)) nx.setDate(nx.getDate() + 1);
    if (nx.getFullYear() === y) set[(nx.getMonth() + 1) + '-' + nx.getDate()] = 'f';
  }
  return set;
}

function buildDayInfo(y, m, mon) {
  const days = new Date(y, m, 0).getDate();
  const info = [null];
  let maxB = 0;
  for (let d = 1; d <= days; d++) maxB = Math.max(maxB, +mon.budget?.[d] || 0);
  for (let d = 1; d <= days; d++) {
    const dow = new Date(y, m - 1, d).getDay();
    const hol = !!mon.hol?.[d];
    const b = +mon.budget?.[d] || 0;
    info.push({ d, dow, hol, kan: !!mon.kan?.[d], nou: !!mon.nou?.[d], ev: !!mon.ev?.[d], busy: !!mon.busy?.[d], budget: b, bn: maxB ? b / maxB : 0, pri: dow === 0 || dow === 6 || hol });
  }
  return info;
}

/* 第n ○曜日の日付（なければ0） */
function nthDow(y, m, nth, dow) {
  const days = new Date(y, m, 0).getDate();
  let c = 0;
  for (let d = 1; d <= days; d++) if (new Date(y, m - 1, d).getDay() === dow && ++c === nth) return d;
  return 0;
}

/* 勤務制限：その日にその番へ入れるか */
function canDo(emp, s, y, m, d) {
  const a = emp.allow || {};
  if (a.E !== false && a.M !== false && a.L !== false) return true;
  const key = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  if (emp.restrFrom && key < emp.restrFrom) return true;   // 期間外には適用しない
  if (emp.restrTo && key > emp.restrTo) return true;
  if (a.E === false && a.M === false && a.L === false) return true; // 全部不可は無効な指定として扱う
  return a[s] !== false;
}

function workBlocks(row, days) {
  const out = []; let st = 0;
  for (let d = 1; d <= days + 1; d++) {
    const w = d <= days && isWork(row[d]);
    if (w && !st) st = d;
    if (!w && st) { out.push([st, d - 1]); st = 0; }
  }
  return out;
}
const blockLen = (a, b, carry) => b - a + 1 + (a === 1 ? carry : 0);

/* 連勤の評価：上限超えのブロックを返す（例外枠を1回だけ消費） */
function streakIssues(row, days, emp, cfg) {
  const L = cfg.streakLimit, carry = emp.carryRun | 0;
  let free = cfg.allowPlus1 && !emp.prevOver ? 1 : 0;
  const bad = []; let max = 0, used = null;
  for (const [a, b] of workBlocks(row, days)) {
    const len = blockLen(a, b, carry);
    if (len > max) max = len;
    if (len <= L) continue;
    if (len === L + 1 && free > 0) { free--; used = [a, b, len]; continue; }
    bad.push([a, b, len]);
  }
  return { bad, max, used };
}

function sandwiches(row, days, emp) {
  const out = [];
  for (let d = 1; d <= days; d++) {
    if (!isWork(row[d])) continue;
    const before = d === 1 ? (emp.carryRun | 0) === 0 : isRest(row[d - 1]);
    const after = d === days ? false : isRest(row[d + 1]);
    if (before && after) out.push(d);
  }
  return out;
}

function dutyWeeks(emp, info, days) {
  const set = emp.dutyDows || [];
  if (!set.length) return [];
  const weeks = {};
  for (let d = 1; d <= days; d++) {
    if (info[d].kan || !set.includes(info[d].dow)) continue;
    const w = Math.floor((d + info[1].dow - 1) / 7);
    (weeks[w] = weeks[w] || []).push(d);
  }
  return Object.values(weeks);
}

/* 定例業務：できる人が店頭にいるべき日のまとまり（each＝各曜日ごと、any＝週ごとにどれか1日） */
const weekNo = (y, m, d) => Math.floor((Date.UTC(y, m - 1, d) / 864e5 + 4) / 7);   // 日曜始まりの通し週番号
/* その日がその業務の実施日か（隔週は基準日と同じ週から1週おき） */
function taskOn(task, y, m, d, dow) {
  if (!(task.dows || []).includes(dow)) return false;
  if (task.freq === 'bi' && task.anchor) {
    const a = task.anchor.split('-').map(Number);
    if (a.length === 3 && a[0]) return (weekNo(y, m, d) - weekNo(a[0], a[1], a[2])) % 2 === 0;
  }
  return true;
}
/* ex＝その月だけの日程変更 { skip:{日:true}, add:{日:true} } */
function taskGroups(task, info, days, y, m, ex) {
  const out = [], skip = (ex && ex.skip) || {}, add = (ex && ex.add) || {};
  if (!(task.members || []).length) return out;
  const weeks = {};
  for (let d = 1; d <= days; d++) {
    if (info[d].kan) continue;
    if (add[d]) { out.push([d]); continue; }                 // 追加した日は、その日に必ず
    if (skip[d] || !taskOn(task, y, m, d, info[d].dow)) continue;
    if (task.mode === 'any') { const w = Math.floor((d + info[1].dow - 1) / 7); (weeks[w] = weeks[w] || []).push(d); }
    else out.push([d]);
  }
  return out.concat(task.mode === 'any' ? Object.values(weeks) : []);
}
/* 備考に業務名を出す日か */
function taskShown(task, y, m, d, dow, ex) {
  if (ex && ex.add && ex.add[d]) return true;
  if (ex && ex.skip && ex.skip[d]) return false;
  if (!taskOn(task, y, m, d, dow)) return false;
  const sh = task.showDows || [];
  if (sh.length) return sh.includes(dow);
  // 「どれか1日」の業務は、指定がなければ週の最後の曜日にだけ出す
  return task.mode === 'any' ? dow === Math.max(...task.dows) : true;
}

/* 開店・閉店の要員がそろうか */
function coverOK(col, emps, y, m, d) {
  let o = [], c = [], n = 0;
  for (let i = 0; i < col.length; i++) {
    const v = col[i];
    if (!onFloor(v)) continue;
    n++;
    if (v === 'F') return true;
    if (v === 'E' || v === 'HP' || ((v === null || v === 'W') && canDo(emps[i], 'E', y, m, d))) o.push(i);
    if (v === 'L' || v === 'HA' || ((v === null || v === 'W') && canDo(emps[i], 'L', y, m, d))) c.push(i);
  }
  if (n < 2) return true;
  if (!o.length || !c.length) return false;
  return !(o.length === 1 && c.length === 1 && o[0] === c[0]);
}

/* ---------- 1. 休みの配置 ---------- */
function placeRests(ctx, seed) {
  const { emps, days, info, pre, cfg, y, m, kokyuu } = ctx;
  const n = emps.length, warnings = [];
  const cells = emps.map(() => Array(days + 1).fill(null));
  for (let i = 0; i < n; i++) for (let d = 1; d <= days; d++) {
    const p = pre[emps[i].id + '-' + d];
    if (info[d].kan) cells[i][d] = 'KAN'; else if (p) cells[i][d] = p;
  }
  // 責任者の必須出勤日
  const chiefDay = cfg.chiefNth ? nthDow(y, m, cfg.chiefNth, cfg.chiefDow) : 0;
  if (chiefDay) emps.forEach((e, i) => {
    if (e.role !== 'chief') return;
    if (cells[i][chiefDay] === null) cells[i][chiefDay] = 'W';
    else if (!onFloor(cells[i][chiefDay])) warnings.push(`${e.name}：責任者の出勤日（${chiefDay}日）に事前登録の予定があり、店頭に出られません。`);
  });
  const need = [];
  for (let i = 0; i < n; i++) {
    let got = 0, free = 0;
    for (let d = 1; d <= days; d++) {
      const c = cells[i][d];
      if (c === 'KB' || c === 'K' || (cfg.includeKan && c === 'KAN')) got++;
      if (c === null) free++;
    }
    let r = (kokyuu[emps[i].id] | 0) - got;
    if (r < 0) { warnings.push(`${emps[i].name}：事前登録の休みが公休日数（${kokyuu[emps[i].id]}日）を${-r}日超えています。`); r = 0; }
    if (r > free) { warnings.push(`${emps[i].name}：公休を置ける日が足りません（残り${r}日に対して空きが${free}日）。`); r = free; }
    need.push(r);
  }
  const fixed = cells.map(r => r.map(c => c !== null));
  const cnt = emps.map(e => !(e.newbie && e.noCount));   // 人数に数えない新人は最低人数・開閉店の要員から外す
  const floor = d => { let k = 0; for (let i = 0; i < n; i++) if (cnt[i] && onFloor(cells[i][d])) k++; return k; };
  const min = cfg.minStaff, pri = Math.max(cfg.priStaff, min), max = Math.max(cfg.maxStaff, pri);
  const tasks = (cfg.tasks || []).map(t => ({ groups: taskGroups(t, info, days, y, m, (ctx.taskEx || {})[t.id]), idx: (t.members || []).map(id => emps.findIndex(e => e.id === id)).filter(i => i >= 0) })).filter(t => t.groups.length && t.idx.length);
  const taskCost = () => {
    let t = 0;
    for (const tk of tasks) for (const g of tk.groups) {
      let ok = false;
      for (const d of g) { for (const i of tk.idx) if (onFloor(cells[i][d])) { ok = true; break; } if (ok) break; }
      if (!ok) t += 150;
    }
    return t;
  };
  const buds = emps.map(e => e.newbie ? (e.buddies || []).map(id => emps.findIndex(x => x.id === id)).filter(i => i >= 0) : []);

  const dayCost = d => {
    if (info[d].kan) return 0;
    let t = 0;
    const k = floor(d), I = info[d];
    if (k < min) t += (min - k) * 400;
    const tgt = I.busy ? Math.max(cfg.busyStaff || pri, min) : pri, mx = I.busy ? Math.max(max, tgt) : max;
    if (k > mx) t += (k - mx) * (k - mx) * 80;
    if (I.busy || I.pri || I.nou || I.ev) {
      const w = I.busy ? 12 + 3 * I.bn : I.pri ? 9 + 3 * I.bn : I.nou ? 5 + I.bn : 4 + I.bn;
      if (k < tgt) t += (tgt - k) * w; else t += (k - tgt) * 3;
    } else if (k > min) t += (k - min) * (2 - 1.5 * I.bn);
    if (k >= 2) { const col = []; for (let i = 0; i < n; i++) col.push(cnt[i] ? cells[i][d] : 'K'); if (!coverOK(col, emps, y, m, d)) t += 300; }
    return t;
  };
  const staffCost = i => {
    let t = 0;
    const row = cells[i], e = emps[i];
    const s = streakIssues(row, days, e, cfg);
    for (const b of s.bad) t += (b[2] - cfg.streakLimit) * 500;
    if (s.used) t += 30;
    if (cfg.avoidSandwich) t += sandwiches(row, days, e).length * 120;
    let run = 0, hasK = false, wr = 0;
    for (let d = 1; d <= days + 1; d++) {
      const r = d <= days && isRest(row[d]) && row[d] !== 'KAN';
      if (r) { run++; if (row[d] === 'K') hasK = true; if (info[d].pri) wr++; }
      else { if (run >= 3 && hasK) t += (run - 2) * 12; run = 0; hasK = false; }
    }
    const bl = buds[i];
    if (bl.length) for (let d = 1; d <= days; d++) if (onFloor(row[d]) && !bl.some(b => onFloor(cells[b][d]))) t += 60;
    return [t, wr];
  };
  const dc = new Float64Array(days + 1), sc = new Float64Array(n), wrs = new Float64Array(n);
  const dependents = emps.map((e, i) => emps.map((x, j) => buds[j].includes(i) ? j : -1).filter(j => j >= 0));
  const total = () => {
    let t = 0, lo = 99, hi = 0;
    for (let d = 1; d <= days; d++) t += dc[d];
    for (let i = 0; i < n; i++) { t += sc[i]; if (wrs[i] < lo) lo = wrs[i]; if (wrs[i] > hi) hi = wrs[i]; }
    return t + (hi - lo) * 4 + taskCost();
  };
  const refreshStaff = i => { const r = staffCost(i); sc[i] = r[0]; wrs[i] = r[1]; };
  const cost = () => {
    for (let d = 1; d <= days; d++) dc[d] = dayCost(d);
    for (let i = 0; i < n; i++) refreshStaff(i);
    return total();
  };
  const touch = (i, a, b) => { dc[a] = dayCost(a); dc[b] = dayCost(b); refreshStaff(i); for (const j of dependents[i]) refreshStaff(j); return total(); };

  const movable = []; for (let i = 0; i < n; i++) if (need[i] > 0) movable.push(i);
  const init = () => {
    for (let i = 0; i < n; i++) {
      for (let d = 1; d <= days; d++) if (!fixed[i][d]) cells[i][d] = null;
      const fr = []; for (let d = 1; d <= days; d++) if (!fixed[i][d]) fr.push(d);
      for (let j = 0; j < need[i]; j++) {
        let idx = Math.min(fr.length - 1, Math.floor((j + 0.5 + (i * 0.37) % 1) * fr.length / need[i]) % fr.length);
        while (cells[i][fr[idx]] === 'K') idx = (idx + 1) % fr.length;
        cells[i][fr[idx]] = 'K';
      }
    }
  };
  let best = null, bestCost = Infinity;
  const rounds = movable.length ? 3 : 1, iters = 26000 + 3000 * n;
  for (let r = 0; r < rounds; r++) {
    const rnd = mulberry32((seed + 1) * 7919 + r * 104729);
    init();
    let cur = cost(), T = 80;
    const cool = Math.pow(0.4 / 80, 1 / iters);
    let lb = cells.map(x => x.slice()), lbc = cur;
    for (let it = 0; it < iters && movable.length; it++, T *= cool) {
      const i = movable[Math.floor(rnd() * movable.length)], row = cells[i];
      const ks = [], fs = [];
      for (let d = 1; d <= days; d++) if (!fixed[i][d]) (row[d] === 'K' ? ks : fs).push(d);
      if (!ks.length || !fs.length) continue;
      const a = ks[Math.floor(rnd() * ks.length)], b = fs[Math.floor(rnd() * fs.length)];
      // 3割は2人の休みを入れ替える（人数を変えずに並びだけ直す）
      let j = -1;
      if (movable.length > 1 && rnd() < 0.3) {
        j = movable[Math.floor(rnd() * movable.length)];
        if (j === i || fixed[j][a] || fixed[j][b] || cells[j][a] !== null || cells[j][b] !== 'K') j = -1;
      }
      row[a] = null; row[b] = 'K';
      if (j >= 0) { cells[j][a] = 'K'; cells[j][b] = null; }
      let nc = touch(i, a, b);
      if (j >= 0) nc = touch(j, a, b);
      if (nc <= cur || rnd() < Math.exp((cur - nc) / T)) {
        cur = nc;
        if (cur < lbc) { lbc = cur; lb = cells.map(x => x.slice()); }
      } else {
        row[a] = 'K'; row[b] = null;
        if (j >= 0) { cells[j][a] = null; cells[j][b] = 'K'; touch(j, a, b); }
        touch(i, a, b);
      }
    }
    if (lbc < bestCost) { bestCost = lbc; best = lb; }
  }
  for (let i = 0; i < n; i++) cells[i] = best[i];
  const shortage = [];
  for (let d = 1; d <= days; d++) if (!info[d].kan) { const k = floor(d); if (k < min) shortage.push({ d, n: k, lack: min - k }); }
  return { cells, warnings, shortage };
}

/* ---------- 2. 番の割り当て ---------- */
function assignShifts(ctx, cells, helpCols) {
  const { emps, days, info, cfg, y, m } = ctx;
  const persons = emps.map((e, i) => ({ row: cells[i], dir: e.dir || 'L2E', emp: e, help: false, count: !(e.newbie && e.noCount),
    same: e.newbie && e.sameShift ? (e.buddies || []).map(id => emps.findIndex(x => x.id === id)).filter(b => b >= 0) : [] }))
    .concat(helpCols.map(col => ({ row: col, dir: 'none', emp: null, help: true, count: true, same: [] })));
  const P = persons.length;
  // 短縮営業日に「全員を1つの番で通す」設定なら、その日は通しにする
  if (cfg.shortSingle) for (let d = 1; d <= days; d++) if ((ctx.short || {})[d]) persons.forEach(p => { if (!p.help && (p.row[d] === null || p.row[d] === 'W')) p.row[d] = 'F'; });
  const wDir = cfg.shiftPolicy === 'fair' ? 30 : 100;
  const plan = [null];
  for (let d = 1; d <= days; d++) {
    const vars = [], allow = [], fx = [], cv = [], fixS = {};
    let fe = 0, fl = 0, cnt = 0;
    persons.forEach((p, i) => {
      const c = p.row[d];
      if (p.help) { if (c === 'H') { vars.push(i); allow.push([true, true, true]); cv.push(true); cnt++; } else fx.push([i, 'rest']); return; }
      if (isRest(c)) { fx.push([i, 'rest']); return; }
      if (c === null || c === 'W') {
        vars.push(i); cv.push(p.count); if (p.count) cnt++;
        allow.push(['E', 'M', 'L'].map(s => canDo(p.emp, s, y, m, d)));
      } else {
        if (onFloor(c) && p.count) cnt++;
        if (c === 'E' || c === 'HP') { if (p.count) fe++; fx.push([i, 'E']); fixS[i] = 0; }
        else if (c === 'L' || c === 'HA') { if (p.count) fl++; fx.push([i, 'L']); fixS[i] = 2; }
        else if (c === 'M') { fx.push([i, 'M']); fixS[i] = 1; }
        else if (c === 'F' && p.count) { fe++; fl++; }
      }
    });
    // 新人をバディと同じ番にする指定：その日に番のあるバディを集めておく
    const same = [];
    vars.forEach((i, j) => {
      const bl = persons[i].same; if (!bl.length) return;
      const bv = [], bf = [];
      bl.forEach(b => { const jj = vars.indexOf(b); if (jj >= 0) bv.push(jj); else if (fixS[b] !== undefined) bf.push(fixS[b]); });
      if (bv.length || bf.length) same.push({ j, bv, bf });
    });
    plan.push({ vars, allow, fx, fe, fl, cnt, cv, same });
  }
  // 直前の番（0なし 1早 2中 3遅）を2ビットずつ持つ。遅→中→早の向きに逆らうと減点
  const step = (last, dir, s) => {
    const lv = s + 1;
    if (dir === 'none') return [0, 0];
    const rev = last && (dir === 'L2E' ? lv > last : lv < last);
    return [rev ? 1 : 0, lv];   // 早→中、中→遅の逆戻りも、早→遅と同じ重さで避ける
  };
  const getL = (st, i) => st >> (2 * i) & 3;
  const setL = (st, i, v) => (st & ~(3 << (2 * i))) | (v << (2 * i));
  // 休み明けは先の番（遅→早なら遅）、休み前は後の番（早）に寄せる
  const posCost = persons.map(p => {
    const out = Array(days + 1).fill(null);
    if (p.help || p.dir === 'none') return out;
    const w = d => d >= 1 && d <= days && !isRest(p.row[d]);
    for (let d = 1; d <= days; d++) {
      if (!w(d)) continue;
      const first = d === 1 ? (p.emp.carryRun | 0) === 0 : !w(d - 1);
      const last = d < days && !w(d + 1);
      if (first === last) continue;                 // 1日だけの出勤・連勤の中日は指定なし
      const head = p.dir === 'L2E' ? 2 : 0, tail = 2 - head, c = [0, 0, 0];
      if (first) { c[tail] = 6; c[1] = 2; } else { c[head] = 6; c[1] = 2; }
      out[d] = c;
    }
    return out;
  });
  const pre = (d, st) => { // 固定分の処理
    let v = 0;
    for (const [i, k] of plan[d].fx) {
      if (k === 'rest') { st = setL(st, i, 0); continue; }
      const [vi, nl] = step(getL(st, i), persons[i].dir, k === 'E' ? 0 : k === 'M' ? 1 : 2);
      v += vi; st = setL(st, i, nl);
    }
    return [st, v];
  };
  const each = (d, st0, fn) => {
    const pl = plan[d], k = pl.vars.length;
    const [st, v0] = pre(d, st0);
    const total = Math.pow(3, k), sh = new Array(k);
    for (let code = 0; code < total; code++) {
      let c = code, ok = true, e = pl.fe, l = pl.fl, v = v0, ns = st, pc = 0;
      for (let j = 0; j < k; j++) {
        const s = c % 3; c = (c - s) / 3;
        if (!pl.allow[j][s]) { ok = false; break; }
        sh[j] = s;
        if (pl.cv[j]) { if (s === 0) e++; else if (s === 2) l++; }
        const i = pl.vars[j];
        const [vi, nl] = step(getL(ns, i), persons[i].dir, s);
        v += vi; ns = setL(ns, i, nl);
        const q = posCost[i][d]; if (q) pc += q[s];
      }
      if (!ok) continue;
      let cst = v * wDir + pc;
      for (const q of pl.same) if (!q.bf.includes(sh[q.j]) && !q.bv.some(jj => sh[jj] === sh[q.j])) cst += 15;
      const n = pl.cnt;
      if (n > 0) {
        if (e === 0) cst += 1000;
        if (l === 0) cst += 1000;
        if (n >= 2) cst += 10 * Math.abs(e - 1) + 10 * Math.abs(l - (n >= 4 ? 2 : 1));
      }
      fn(cst, ns, sh);
    }
  };
  const memo = Array.from({ length: days + 2 }, () => new Map());
  const V = (d, st) => {
    if (d > days) return 0;
    const mm = memo[d];
    if (mm.has(st)) return mm.get(st);
    let best = Infinity;
    each(d, st, (c, ns) => { const t = c + V(d + 1, ns); if (t < best) best = t; });
    if (best === Infinity) best = 5000 + V(d + 1, pre(d, st)[0]);
    mm.set(st, best);
    return best;
  };
  let st = 0;
  persons.forEach((p, i) => {
    if (p.help || p.dir === 'none') return;
    const e = p.emp, lv = { E: 1, M: 2, L: 3 }[e.carryShift] || 0;
    if ((e.carryRun | 0) > 0 && lv) st = setL(st, i, lv);
  });
  const counts = persons.map(() => [0, 0, 0]);
  const fairW = cfg.shiftPolicy === 'fair' ? 3 : 0;
  for (let d = 1; d <= days; d++) {
    const pl = plan[d];
    let best = Infinity, bestTie = Infinity, pick = null, pickNs = st;
    const mins = [0, 1, 2].map(s => Math.min(...persons.filter(p => !p.help).map((p, i) => counts[i][s])));
    each(d, st, (c, ns, sh) => {
      let tie = 0;
      for (let j = 0; j < sh.length; j++) { const i = pl.vars[j]; if (!persons[i].help) tie += counts[i][sh[j]] - mins[sh[j]]; }
      const t = c + V(d + 1, ns) + fairW * tie;
      if (t < best - 1e-9 || (Math.abs(t - best) < 1e-9 && tie < bestTie)) { best = t; bestTie = tie; pick = sh.slice(); pickNs = ns; }
    });
    if (!pick) { pick = pl.vars.map(() => 1); pickNs = pre(d, st)[0]; }
    pl.vars.forEach((i, j) => { persons[i].row[d] = 'EML'[pick[j]]; counts[i][pick[j]]++; });
    st = pickNs;
  }
}

/* ---------- 3. まとめ（休み配置 → 人数割れの扱い → 番） ---------- */
function finalize(ctx, placed, mode) {
  const { emps, days } = ctx;
  const cells = placed.cells.map(r => r.slice());
  const helpN = mode === 'help' ? Math.max(0, ...placed.shortage.map(s => s.lack)) : 0;
  const helpCols = [];
  for (let j = 0; j < helpN; j++) {
    const col = Array(days + 1).fill(null);
    for (const s of placed.shortage) if (j < s.lack) col[s.d] = 'H';
    helpCols.push(col);
  }
  assignShifts(ctx, cells, helpCols);
  const out = {};
  emps.forEach((e, i) => { out[e.id] = cells[i]; });
  return {
    cells: out, help: helpCols, warnings: placed.warnings,
    accepted: mode === 'asis' ? placed.shortage.map(s => s.d) : [],
    helpDays: mode === 'help' ? placed.shortage.map(s => s.d) : []
  };
}

/* ---------- 4. 確認 ---------- */
function checkResult(ctx, res) {
  const { emps, days, info, cfg, y, m, kokyuu, pre } = ctx;
  const errors = [], warns = [], bad = new Set(), rules = [true, true, true, true, true, true];
  const mark = (id, d) => bad.add(id + '-' + d);
  const rows = emps.map(e => res.cells[e.id] || Array(days + 1).fill(null));
  const cnt = emps.map(e => !(e.newbie && e.noCount));
  const help = res.help || [];
  const min = cfg.minStaff, pri = Math.max(cfg.priStaff, min), max = Math.max(cfg.maxStaff, pri);
  const dayCount = [0], helpDays = [];
  let sum = 0, open = 0;
  for (let d = 1; d <= days; d++) {
    let n = 0, e = 0, l = 0, h = 0;
    rows.forEach((r, i) => { const c = r[d]; if (cnt[i] && onFloor(c) && c !== null) { n++; if (c === 'E' || c === 'HP' || c === 'F') e++; if (c === 'L' || c === 'HA' || c === 'F') l++; } });
    help.forEach(col => { const c = col[d]; if (isShift(c)) { n++; h++; if (c === 'E') e++; if (c === 'L') l++; } });
    dayCount.push(n);
    if (info[d].kan) continue;
    open++; sum += n;
    if (h) helpDays.push(`${d}日（${h}名）`);
    if (n < min) {
      if ((res.accepted || []).includes(d)) warns.push(`${d}日：店頭${n}名（最低${min}名）。人数割れを了承して作成した日です。`);
      else errors.push(`${d}日：店頭${n}名で、最低人数${min}名を下回っています。`);
    }
    if (n === 1 && (res.accepted || []).includes(d)) { /* 了承済みの1名体制 */ }
    else if (n > 0 && (e === 0 || l === 0)) {
      rules[4] = false;
      errors.push(`${d}日：${e === 0 ? '早番（開店の要員）' : ''}${e === 0 && l === 0 ? 'と' : ''}${l === 0 ? '遅番（閉店の要員）' : ''}がいません。`);

  if (e.key === 'Escape') { if (S.dlg && S.dlg.type !== 'short') { S.dlg = null; render(); } else if (S.pick) { S.pick = null; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('td.cell')) { e.preventDefault(); onClick(e.target); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.id) { const emp = S.cfg.emps.find(x => x.id === d.dataset.id); if (emp) emp._open = d.open; } }, true);
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.some(x => x[0] === t) && t !== S.tab) setTab(t); });
(function init() { const t = location.hash.slice(1); if (TABS.some(x => x[0] === t)) S.tab = t; loadMon(); S.saved = store.set('config', S.cfg); render(); })();

</script>
